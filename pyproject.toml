[project]
name = "upper-benue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Williams Adaji-Agbane", email = "wadaji-agbane337@stu.ui.edu.ng" }
]
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "earthengine-api>=1.7.49",
    "geemap>=0.37.2",
    "geopandas>=1.2.0",
    "imbalanced-learn>=0.14.2",
    "jenkspy>=0.4.1",
    "matplotlib>=3.11.2",
    "pyale>=1.2.0",
    "pytorch-tabnet>=4.1.0",
    "rasterio>=1.4.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "statsmodels>=0.15.0",
    "xgboost>=3.2.0",
]

[project.scripts]
upper-benue = "upper_benue:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
